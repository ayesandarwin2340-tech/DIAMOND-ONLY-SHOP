<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Zinko — MLBB Diamonds</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root{
      --bg-page: linear-gradient(180deg,#061021 0%, #071424 70%);
      --card-bg: rgba(3,10,18,0.7);
      --glass: rgba(255,255,255,0.03);
      --accent: #00eaff;
      --accent-2: #00ffd5;
      --muted: #9be8ff;
      --text: #e9fbff;
      --radius: 12px;
      --container-max: 1100px;
      --shadow-1: 0 10px 30px rgba(2,10,20,0.6);
      --glass-border: rgba(0,230,255,0.06);
    }

    *{box-sizing:border-box; margin:0; padding:0}
    body{
      min-height:100vh;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: var(--bg-page);
      color:var(--text);
      display:flex;
      justify-content:center;
      padding:15px;
      /* Telegram Web App Safe Area */
      padding-top: env(safe-area-inset-top);
    }

    .site { width:100%; max-width:var(--container-max); display: grid; grid-template-columns: 1fr 1.2fr; gap: 15px; }
    @media (max-width: 900px) { .site { grid-template-columns: 1fr; } }

    .card{
      background: linear-gradient(180deg, rgba(2,10,20,0.85), rgba(0,6,12,0.65));
      border-radius:var(--radius);
      padding:18px;
      border:1px solid var(--glass-border);
      box-shadow: var(--shadow-1);
    }

    .product { display:flex; flex-direction:column; gap:10px; }
    .title { font-size:1.5rem; font-weight:800; color:var(--muted); }
    .art { height:200px; border-radius:12px; overflow:hidden; border:1px solid rgba(0,230,255,0.1); background: #000; }
    .art img{ width:100%; height:100%; object-fit:cover; transition:opacity .5s; }

    .packages { display:grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap:10px; margin-top:10px; }
    .pkg {
      background: rgba(0,25,30,0.6); border-radius:10px; padding:12px; cursor:pointer;
      border:1px solid rgba(0,230,255,0.1); text-align:center; transition: 0.2s;
    }
    .pkg:hover { transform: translateY(-3px); border-color: var(--accent); }
    .pkg.active { background: rgba(0,230,255,0.15); border-color: var(--accent); box-shadow: 0 0 15px rgba(0,230,255,0.2); }
    .pkg img { width:40px; margin-bottom:5px; }

    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.9rem; margin-bottom: 5px; color: var(--muted); font-weight: 600; }
    input, textarea, .select-box {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--accent);
      padding: 12px; border-radius: 10px; color: white; outline: none; font-size: 1rem;
    }

    .select-box { position: relative; cursor: pointer; }
    .options {
      position: absolute; top: 100%; left: 0; width: 100%; background: #001a26;
      border: 1px solid var(--accent); border-radius: 10px; display: none; z-index: 100;
      list-style: none; margin-top: 5px; overflow: hidden;
    }
    .options li { padding: 12px; border-bottom: 1px solid rgba(0,230,255,0.1); }
    .options li:hover { background: #003d55; }

    #payDetail {
      background: rgba(0,230,255,0.08); padding: 12px; border-radius: 10px;
      border: 1px dashed var(--accent); margin-top: 10px; display: none; font-size: 0.9rem;
    }

    .btn {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      color: #001a26; border: none; padding: 14px; border-radius: 10px;
      font-weight: 800; cursor: pointer; width: 100%; transition: 0.3s;
    }
    .btn:active { transform: scale(0.98); }
    .back-button { width: fit-content; padding: 8px 15px; background: #2b136b; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 10px; }

    /* Support Box */
    .support-box {
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 15px;
      text-align: center;
    }
    .support-title { font-size: 0.85rem; font-weight: 700; color: var(--muted); margin-bottom: 15px; text-transform: uppercase; letter-spacing: 1px; }
    .support-icons { display: flex; justify-content: space-around; gap: 10px; }
    .support-icons .icon { text-decoration: none; color: var(--text); display: flex; flex-direction: column; align-items: center; gap: 8px; transition: 0.3s; flex: 1; }
    .support-icons .icon:hover { transform: translateY(-3px); color: var(--accent); }
    .support-icons .icon img { filter: drop-shadow(0 0 5px rgba(0,234,255,0.2)); }
    .support-icons .icon div { font-size: 0.7rem; font-weight: 600; }

    #nickWrapper { margin-bottom: 12px; font-size: 0.85rem; display: none; background: rgba(0, 234, 255, 0.1); padding: 10px; border-radius: 10px; border-left: 4px solid var(--accent); }
    
    .toast {
      position:fixed; left:50%; transform:translateX(-50%); bottom:30px;
      background: var(--accent); color:#000; padding:10px 25px; border-radius:30px;
      font-weight: bold; display:none; z-index: 10000; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="site">
    <section class="card product">
      <button class="back-button" onclick="window.history.back()"><i class="fas fa-arrow-left"></i> Back</button>
      <div style="display:flex; align-items:center; gap:12px;">
        <img src="https://cdn1.codashop.com/S/content/mobile/images/product-tiles/MLBB-2025-tiles-178x178.jpg" width="50" style="border-radius:8px;">
        <div class="title">MOBILE LEGENDS : BANG BANG</div>
      </div>
      <div class="art"><img id="slide" src=""></div>
      <div id="selectedPreview" class="card" style="background:rgba(0,230,255,0.05); text-align:center; font-weight:bold; padding:10px;">No package selected</div>
      <div class="packages" id="packages"></div>
    </section>

    <section class="card">
      <div class="section-title" style="font-size:1.1rem; margin-bottom:15px; color:var(--accent); font-weight: bold;">ORDER DETAILS</div>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        <div class="form-group"><label>Game ID🎮</label><input id="gameId" type="number" placeholder="12345678" oninput="validatePlayer()"></div>
        <div class="form-group"><label>Server ID🌐</label><input id="serverId" type="number" placeholder="1234" oninput="validatePlayer()"></div>
      </div>

      <div id="nickWrapper">
        <i class="fas fa-user-circle"></i> Player: <span id="nickName" style="color:var(--accent-2); font-weight:bold;">Checking...</span>
      </div>

      <div class="form-group">
        <label>Payment Method💳</label>
        <div class="select-box" id="paymentBox">
          <div class="selected">Select Payment</div>
          <ul class="options">
            <li data-value="KPay" data-num="09988842463" data-name="Aung Thant Zin Ko">KBZ Pay</li>
            <li data-value="WavePay" data-num="09953852354" data-name="Aye Sander Win">Wave Pay</li>
          </ul>
        </div>
        <input type="hidden" id="paymentMethod">
        <div id="payDetail">
          <div style="display:flex; justify-content:space-between;"><span>Name:</span> <b id="pName" style="color:var(--accent);"></b></div>
          <div style="display:flex; justify-content:space-between; margin-top:5px;"><span>Number:</span> <b id="pNum" style="color:var(--accent);"></b></div>
        </div>
      </div>

      <div class="form-group">
        <label>Transaction ID (Last 6 Digits)📃</label>
        <input id="transactionId" type="text" placeholder="######">
      </div>

      <div class="form-group">
        <label>Payment Screenshot</label>
        <input id="screenshotInput" type="file" accept="image/*" style="display:none">
        <div style="display:flex; gap:10px;">
          <div id="fileName" style="flex:1; border:1px solid var(--accent); padding:10px; border-radius:10px; font-size:0.8rem; overflow:hidden; background:rgba(255,255,255,0.05);">No file selected</div>
          <button class="btn" style="width:80px; padding:10px;" onclick="document.getElementById('screenshotInput').click()">CHOOSE</button>
        </div>
      </div>

      <div class="form-group">
        <label>Note (Optional)</label>
        <textarea id="orderNote" rows="2" placeholder="Any message..."></textarea>
      </div>

      <button class="btn" onclick="submitOrder()">SUBMIT ORDER</button>

      <div class="support-box">
        <div class="support-title">Customer Service</div>
        <div class="support-icons">
          <a class="icon" href="https://t.me/Zinko158" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/2111/2111646.png" width="24"><div>Telegram</div>
          </a>
          <a class="icon" href="https://www.facebook.com/share/ZINKO/" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" width="24"><div>Facebook</div>
          </a>
          <a class="icon" href="mailto:ggaahe32@gmail.com">
            <img src="https://cdn-icons-png.flaticon.com/512/281/281769.png" width="24"><div>Email</div>
          </a>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <div id="confirmBox" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);align-items:center;justify-content:center;z-index:9999;">
    <div class="card" style="width:90%; max-width:400px; border:1px solid var(--accent);">
      <h3 style="text-align:center; color:var(--accent);">Confirm Order</h3>
      <div id="confirmList" style="margin:20px 0; font-size:0.9rem; line-height:1.8;"></div>
      <div style="display:flex; gap:10px;">
        <button onclick="document.getElementById('confirmBox').style.display='none'" class="btn" style="background:gray;">Edit</button>
        <button onclick="sendToTelegram()" class="btn">Send Now</button>
      </div>
    </div>
  </div>

  <script>
    // --- TELEGRAM WEB APP INIT ---
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // --- CONFIG ---
    const BOT_TOKEN = "8232335563:AAHBZJpBq2x98SaDLVVL0Go_Fql77lhyYn0";
    const CHAT_ID = "6873534451";

    const PACKAGES = [
      {name:'5 Diamonds', price:500, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760334250020_b0872ecf-3f35-4a3a-be97-6e0073600751.png"},
      {name:'11 Diamonds', price:950, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760334250020_b0872ecf-3f35-4a3a-be97-6e0073600751.png"},
      {name:'22 Diamonds', price:2000, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760334250020_b0872ecf-3f35-4a3a-be97-6e0073600751.png"},
      {name:'56 Diamonds', price:4200, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245898_e3d40beb-2e0d-473c-b9ff-be6c797666db.png"},
      {name:'86 Diamonds', price:4850, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245898_e3d40beb-2e0d-473c-b9ff-be6c797666db.png"},
      {name:'112 Diamonds', price:8400, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245898_e3d40beb-2e0d-473c-b9ff-be6c797666db.png"},
      {name:'172 Diamonds', price:9400, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245337_6859fea9-7abd-48f2-8625-da79f9f29abe.png"},
      {name:'257 Diamonds', price:14200, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245337_6859fea9-7abd-48f2-8625-da79f9f29abe.png"},
      {name:'343 Diamonds', price:19600, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245337_6859fea9-7abd-48f2-8625-da79f9f29abe.png"},
      {name:'514 Diamonds', price:28200, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245337_6859fea9-7abd-48f2-8625-da79f9f29abe.png"},
      {name:'963 Diamonds', price:51500, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245337_6859fea9-7abd-48f2-8625-da79f9f29abe.png"},
      {name:'1412 Diamonds', price:75000, icon: "https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335245337_6859fea9-7abd-48f2-8625-da79f9f29abe.png"},

      {name:'Diamond100 (50+50)\nFirst Recharged!', price:3500, icon:"https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760334222477_bdd28040-0bd9-4dff-b748-ed7b1a0aecdd.png"},
      {name:'Diamond300 (150+150)\nFirst Recharged!', price:10000, icon:"https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760334222415_581d8871-25f1-4a8c-a45c-297bfbc69d6c.png"},
      {name:'Diamond500 (250+250)\nFirst Recharged!', price:16200, icon:"https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760334222415_581d8871-25f1-4a8c-a45c-297bfbc69d6c.png"},
      {name:'Diamond1000 (500+500)\nFirst Recharged!', price:32000, icon:"https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760334222388_daa6d2f0-0249-4fa5-bb28-5ce48267c1d8.png"},
      
      {name:'Weekly Pass', price:5950, icon:"https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760334604324_13680c57-734d-4b72-a430-8bdbded02ab8.png"},
      {name:'Twilight Pass', price:33000, icon:"https://cdn1.codashop.com/images/106_5e7a01a7-89b9-4b13-a512-a3e72f63f0d1_product/1760335243879_e08cea74-4cdb-4629-a6b6-e28db8ebf4b8.png"}
    ];

    let selectedPkg = null;
    let currentNickname = "";

    // Render Packages
    const pkgContainer = document.getElementById('packages');
    PACKAGES.forEach(p => {
      const div = document.createElement('div');
      div.className = 'pkg';
      div.innerHTML = `<img src="${p.icon}"><div style="font-weight:700; font-size:0.75rem;">${p.name}</div><div style="color:var(--accent); font-size:0.8rem;">${p.price} Ks</div>`;
      div.onclick = () => {
        document.querySelectorAll('.pkg').forEach(x => x.classList.remove('active'));
        div.classList.add('active');
        selectedPkg = p;
        document.getElementById('selectedPreview').innerHTML = `${p.name} — ${p.price} Ks`;
        if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      };
      pkgContainer.appendChild(div);
    });

    // --- ID CHECKER LOGIC ---
    let nickTimeout;
    async function validatePlayer() {
      const id = document.getElementById('gameId').value.trim();
      const zone = document.getElementById('serverId').value.trim();
      const wrapper = document.getElementById('nickWrapper');
      const nickSpan = document.getElementById('nickName');

      if(id.length >= 5 && zone.length >= 4) {
        wrapper.style.display = 'block';
        nickSpan.innerText = "Checking...";
        nickSpan.style.color = "var(--muted)";
        
        clearTimeout(nickTimeout);
        nickTimeout = setTimeout(async () => {
          try {
            const res = await fetch(`https://api.isan.eu.org/nickname/ml?id=${id}&server=${zone}`);
            const data = await res.json();
            if(data && data.name) {
              currentNickname = data.name;
              nickSpan.innerText = data.name;
              nickSpan.style.color = "var(--accent-2)";
            } else {
              currentNickname = "Not Found";
              nickSpan.innerText = "User Not Found!";
              nickSpan.style.color = "#ff4d4d";
            }
          } catch(e) { nickSpan.innerText = "Error (Server Busy)"; }
        }, 1000);
      } else { wrapper.style.display = 'none'; currentNickname = ""; }
    }

    // Payment Selection
    const payBox = document.getElementById('paymentBox');
    const options = payBox.querySelector('.options');
    payBox.onclick = () => options.style.display = options.style.display === 'block' ? 'none' : 'block';

    options.querySelectorAll('li').forEach(li => {
      li.onclick = (e) => {
        e.stopPropagation();
        document.getElementById('paymentMethod').value = li.dataset.value;
        payBox.querySelector('.selected').innerText = li.innerText;
        options.style.display = 'none';
        document.getElementById('payDetail').style.display = 'block';
        document.getElementById('pName').innerText = li.dataset.name;
        document.getElementById('pNum').innerText = li.dataset.num;
      };
    });

    document.getElementById('screenshotInput').onchange = function() {
      document.getElementById('fileName').innerText = this.files[0] ? this.files[0].name : "No file selected";
    };

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg; t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    function submitOrder() {
      const d = {
        id: document.getElementById('gameId').value.trim(),
        sv: document.getElementById('serverId').value.trim(),
        pay: document.getElementById('paymentMethod').value,
        tx: document.getElementById('transactionId').value.trim(),
        file: document.getElementById('screenshotInput').files[0]
      };

      if(!selectedPkg || !d.id || !d.sv || !d.pay || !d.tx || !d.file) return showToast("အကုန်ဖြည့်ပေးပါခင်ဗျာ။");
      
      if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      document.getElementById('confirmList').innerHTML = `
        👤 <b>Player:</b> ${currentNickname || 'Checking...'}<br>
        💎 <b>Item:</b> ${selectedPkg.name}<br>
        💰 <b>Price:</b> ${selectedPkg.price} Ks<br>
        🎮 <b>ID:</b> ${d.id} (${d.sv})<br>
        💳 <b>Payment:</b> ${d.pay}
      `;
      document.getElementById('confirmBox').style.display = 'flex';
      window._temp = d;
    }

    async function sendToTelegram() {
      const d = window._temp;
      const note = document.getElementById('orderNote').value;
      document.getElementById('confirmBox').style.display = 'none';
      showToast("Sending Order...");

      const message = `📦 *New MLBB Order*\n━━━━━━━━━━━━━━\n👤 *Player:* ${currentNickname}\n💎 *Item:* ${selectedPkg.name}\n💰 *Price:* ${selectedPkg.price} Ks\n🎮 *ID:* ${d.id} (${d.sv})\n💳 *Pay:* ${d.pay}\n🧾 *Tran:* ${d.tx}\n📝 *Note:* ${note || '-'}\n━━━━━━━━━━━━━━`;

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ chat_id: CHAT_ID, text: message, parse_mode: 'Markdown' })
        });

        const fd = new FormData();
        fd.append('chat_id', CHAT_ID);
        fd.append('photo', d.file);
        fd.append('caption', `Slip: ${d.id} (${currentNickname})`);
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd });

        tg.showAlert("Order တင်ခြင်း အောင်မြင်ပါသည်။ ခေတ္တစောင့်ဆိုင်းပေးပါ။", () => location.reload());
      } catch (err) { showToast("Error. Please try again."); }
    }

    const slides = ["https://images.hdqwalls.com/download/kimmy-skin-charge-leader-in-mobile-legends-qw-1910x1075.jpg", "https://images.hdqwalls.com/wallpapers/tides-of-annihilation-3w.jpg"];
    let sIdx = 0;
    function runSlide() {
      const el = document.getElementById('slide');
      if(el) { el.src = slides[sIdx]; sIdx = (sIdx + 1) % slides.length; }
    }
    runSlide(); setInterval(runSlide, 5000);
  </script>
</body>
</html>
